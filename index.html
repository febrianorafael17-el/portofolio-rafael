<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio CV</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 20% 20%, rgba(102, 126, 234, 0.25), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(240, 147, 251, 0.2), transparent 40%),
                #0f172a;
            color: #e2e8f0;
            line-height: 1.6;
            min-height: 100vh;
        }

        html {
            scroll-behavior: smooth;
        }

        /* Navbar Styles */
        nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 12px 40px;
            /* diperpanjang */
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 900px;
        }

        nav .nav-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            /* ini penting */
            gap: 40px;
            width: 100%;
        }

        nav .logo {
            color: white;
            font-weight: bold;
            font-size: 1.1em;
            margin-right: 10px;
            text-decoration: none;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        nav ul li {
            position: relative;
        }

        nav ul li a {
            position: relative;
            color: #e2e8f0;
            text-decoration: none;
            font-size: 0.9em;
            padding: 5px 10px;
            transition: 0.3s;
        }

        /* underline animasi */
        nav ul li a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 0%;
            height: 2px;
            background: linear-gradient(90deg, #38bdf8, #f472b6);
            transition: width 0.3s ease;
        }

        /* hover */
        nav ul li a:hover::after {
            width: 100%;
        }

        /* warna hover */
        nav ul li a:hover {
            color: #38bdf8;
        }

        /* active indicator (underline kecil) */
        nav ul li.active a::after {
            width: 100%;
        }


        @keyframes moveBackground {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(50px, 50px);
            }
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        section {
            background: white;
            padding: 40px;
            margin: 20px 0;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            animation: fadeInUp 0.6s ease-out;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-left: 5px solid;
        }

        section:nth-child(1) {
            border-left-color: #667eea;
        }

        section:nth-child(2) {
            border-left-color: #764ba2;
        }

        section:nth-child(3) {
            border-left-color: #f093fb;
        }

        section:nth-child(4) {
            border-left-color: #4facfe;
        }

        section:nth-child(5) {
            border-left-color: #00f2fe;
        }

        section:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        @keyframes fadeInUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        h2 {
            font-size: 2em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2 i {
            -webkit-text-fill-color: unset;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        ul {
            list-style: none;
        }

        li {
            padding-left: 0;
        }

        li:before {
            display: none;
        }

        li:hover {
            transform: translateX(10px);
            color: #667eea;
        }

        p {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 15px;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-top: 40px;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        footer p {
            color: white;
            margin: 5px 0;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .social-links a {
            color: white;
            font-size: 1.5em;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
        }

        .social-links a:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.4);
        }

        .skill-item {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            margin: 5px;
            font-size: 0.95em;
            transition: all 0.3s ease;
            animation: slideInUp 0.6s ease-out;
        }

        .skill-item:hover {
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .hero {
            padding: 160px 20px 60px;
        }

        .hero-container {
            max-width: 1100px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
        }

        /* TEXT */
        .hero-text h1 {
            font-size: 3em;
            color: white;
            margin: 15px 0;
        }

        .hero-text span {
            background: linear-gradient(90deg, #38bdf8, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-text p {
            color: #94a3b8;
        }

        /* BADGE */
        .badge {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8em;
            color: #38bdf8;

            background: rgba(255, 255, 255, 0.05);
            /* transparan */
            backdrop-filter: blur(10px);
            /* efek kaca */
            border: 1px solid rgba(255, 255, 255, 0.1);

            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        /* BUTTON */
        .hero-buttons {
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            margin-right: 10px;
            display: inline-block;
            transition: 0.3s;
        }

        .btn.primary {
            background: linear-gradient(90deg, #6366f1, #ec4899);
            color: white;
        }

        .btn.secondary {
            border: 1px solid #38bdf8;
            color: #38bdf8;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        /* TAGS */
        .hero-tags {
            margin-top: 20px;
        }

        .hero-tags span {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 15px;
            border-radius: 20px;
            margin-right: 10px;
            color: #cbd5f5;
        }

        /* IMAGE */
        .hero-image img {
            width: 440px;
            height: auto;
            object-fit: cover;
            border-radius: 20px;
            transform: rotate(3deg) translateY(10px);
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.5),
                /* shadow utama */
                0 0 0 3px rgba(255, 255, 255, 0.1),
                /* outline tipis */
                0 0 25px rgba(99, 102, 241, 0.6),
                /* glow biru */
                0 0 60px rgba(236, 72, 153, 0.4);
            /* glow pink */
        }

        .hero-image img:hover {
            transform: rotate(0deg) scale(1.05);
        }

        .hero-image {
            position: relative;
        }

        .hero-image::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #6366f1, transparent);
            filter: blur(80px);
            z-index: -1;
        }

        /* === ANIMASI MASUK === */
        .fade-up {
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            animation: fadeUp 0.8s ease forwards;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* delay biar gak barengan */
        .delay-1 {
            animation-delay: 0.2s;
        }

        .delay-2 {
            animation-delay: 0.4s;
        }

        nav {
            opacity: 0;
            transform: translateX(-50%) translateY(-30px);
            animation: navDrop 0.6s ease forwards;
        }

        @keyframes navDrop {
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @media (max-width: 768px) {

            /* NAVBAR */
            nav {
                min-width: unset;
                width: 90%;
                padding: 10px 20px;
            }

            nav ul {
                gap: 10px;
                flex-wrap: wrap;
                justify-content: center;
            }

            nav .nav-container {
                flex-direction: column;
                gap: 10px;
            }

            nav ul li a {
                font-size: 0.8em;
            }

            /* HERO */
            .hero {
                padding: 170px 20px 40px;
            }

            .hero-container {
                flex-direction: column;
                text-align: center;
                gap: 30px;
            }

            /* TEXT */
            .hero-text h1 {
                font-size: 2em;
            }

            .hero-text p {
                font-size: 0.95em;
            }

            /* BUTTON */
            .hero-buttons {
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
                gap: 10px;
            }

            .btn {
                margin-right: 0;
            }

            /* IMAGE */
            .hero-image img {
                width: 260px;
                transform: rotate(0deg) translateY(0);
            }

            .hero-image::before {
                width: 200px;
                height: 200px;
            }
        }

        /* === SOCIAL ICONS === */
        .social-icons {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }

        .social-icons a {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            font-size: 20px;
            color: white;

            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);

            transition: 0.3s;
        }

        .social-icons a:hover {
            transform: translateY(-5px) scale(1.1);
        }

        .social-icons .ig:hover {
            box-shadow: 0 0 20px #e1306c;
        }

        .social-icons .linkedin:hover {
            box-shadow: 0 0 20px #0a66c2;
        }

        .social-icons .github:hover {
            box-shadow: 0 0 20px #ffffff;
        }

        .social-icons .gmail:hover {
            box-shadow: 0 0 20px #ea4335;
        }
    </style>
</head>

<body>

    <script>
        const navLinks = document.querySelectorAll('.nav-link');

        navLinks.forEach(link => {
            link.addEventListener('click', function (e) {

                // hanya block kalau link internal (#)
                if (this.getAttribute("href").startsWith("#")) {
                    e.preventDefault();

                    document.querySelectorAll('nav ul li').forEach(li => {
                        li.classList.remove('active');
                    });

                    this.parentElement.classList.add('active');
                }
            });
        });

    </script>

</body>

</html>
